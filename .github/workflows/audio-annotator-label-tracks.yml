name: Audio Annotator v2 label tracks

on:
  push:
    branches:
      - feature/audio-label-stacks-resizable-20261028
  workflow_dispatch:

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright numpy soundfile
      - run: python -m playwright install --with-deps chromium
      - run: python tests/audio_annotator_v2/run.py --suite label_tracks
